services:
    postgres:
        image: postgres:16-alpine
        container_name: chainpulse-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: chainpulse
            POSTGRES_PASSWORD: chainpulse
            POSTGRES_DB: chainpulse
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U chainpulse -d chainpulse"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    redis:
        image: redis:7-alpine
        container_name: chainpulse-redis
        restart: unless-stopped
        command: redis-server --requirepass chainpulse --maxmemory 256mb --maxmemory-policy allkeys-lru
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "chainpulse", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
